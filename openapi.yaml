openapi: 3.1.0
info:
  title: TLDP API
  version: 1.0.0
  description: |
    # Tybrite Logistics Developer Platform (TLDP) API

    The unified logistics API — one integration aggregates many courier
    services (rates, shipment creation, real-time tracking, proof of delivery,
    webhooks). "Stripe for logistics."

    ## Authentication
    All requests use API-key bearer auth. Keys are dual-key:
    - **Secret** (`tybrite_sk_live_*` / `tybrite_sk_test_*`) — full read/write.
    - **Publishable** (`tybrite_pk_live_*` / `tybrite_pk_test_*`) — read-only.

    ```
    Authorization: Bearer tybrite_sk_live_...
    ```

    `_live_` keys hit production; `_test_` keys hit the sandbox.

    ## Rate limits
    Authenticated endpoints are limited **per API key** (the `/v1` API is server-to-server —
    your backend holds the key — so the key is the identity). Fixed 60-second window:
    - **Production: 120 requests / minute / key**
    - **Sandbox: 30 requests / minute / key** (throttled harder for testing)

    The public tracking endpoint (no key) is limited **per IP** (60 / minute / IP).

    Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and
    `X-RateLimit-Reset` (unix epoch seconds). Exceeding the window returns
    **429** `rate_limit_exceeded`.

    ## Status code conventions
    - **201 Created** — a POST that creates a new resource (`POST /v1/orders`,
      `/v1/shipments`, `…/fulfil`, `…/fulfil-on-demand`, `POST /v1/webhooks`).
    - **200 OK** — reads, and POSTs that mutate without creating (`…/cancel`), or an
      **idempotent replay** (e.g. `POST /v1/shipments` with a reused `Idempotency-Key`
      returns the original shipment as 200, not a duplicate).
    - **202 Accepted** — work queued asynchronously (`POST /v1/webhooks/{id}/test`).

    ## Idempotency
    Write endpoints accept an `Idempotency-Key` header; retrying with the same key
    returns the original result instead of creating a duplicate.

    ## Caching
    Read endpoints whose body is the same for everyone — **public tracking** (~15s) and
    **coverage zones** (~5min) — are edge-cached and ETag-validated. Each returns `ETag`,
    `Cache-Control`, and `X-Cache` (`HIT`/`MISS`). Send the `ETag` back as `If-None-Match` to
    get a **304 Not Modified** (empty body) when the resource is unchanged — cheaper for you and
    for us. Per-tenant/authed data is never edge-cached.

    ## Webhook events — two layers, decoupled on purpose
    Subscribe at `POST /v1/webhooks`. Events live at **two distinct layers** that answer
    different questions — subscribe to whichever you need:

    - **`order.*` = business / commitment state** (one event per transition). An order is the
      thing your buyer placed; these tell you where it is in *your* fulfilment workflow.
      - `order.created` — an order was pushed/placed.
      - `order.fulfilled` — the merchant committed the order to delivery and **a shipment now
        exists for it**. Fires **once**. Use this to mark your order "shipping" and stop allowing
        buyer edits.
      - `order.cancelled` — the order was cancelled (and any not-yet-picked-up shipment with it).
      - *(returns)* `return.requested`, `return.approved`, `return.rejected`, `return.received`,
        `return.refunded`, `return.exchanged` — the reverse-logistics lifecycle.

    - **`shipment.*` = physical-delivery telemetry** (many events as the parcel moves). This is
      the play-by-play emitted as the rider advances status: `shipment.created`,
      `shipment.payment_confirmed`, `shipment.assigned`, `shipment.picked_up`,
      `shipment.in_transit`, `shipment.out_for_delivery`, `shipment.delivered`,
      `shipment.failed`, `shipment.cancelled`. Subscribe for live tracking / proof of delivery.

    - **`payment.*`**: `payment.pending_settlement`, `payment.settled`.

    **Relationship:** an order has exactly **one** `order.fulfilled`, but **many** `shipment.*`
    updates underneath it. They are deliberately decoupled: if you only track order state,
    subscribe to `order.*`; if you want live movement, subscribe to `shipment.*`. Note that
    **order-less direct shipments** (created via `POST /v1/shipments` with no order) emit
    `shipment.*` only — never `order.*`. Conversely an order that hasn't been fulfilled yet has
    `order.*` but no `shipment.*`.

    Every delivery is HMAC-signed (`TLDP-Signature: t=…,v1=…`, HMAC-SHA256 of `${t}.${body}`
    with your endpoint's `signing_secret`). Respond `2xx` to acknowledge.

    ## Errors
    Errors return `{ "error": { "code", "message", "details?" } }` with a conventional
    HTTP status. Common codes: `invalid_request` (400), `unauthorized` /
    `invalid_api_key` (401), `forbidden` / `account_inactive` (403), `not_found` (404),
    `cannot_fulfil` / `cannot_cancel` / `cannot_edit` (409), `rate_limit_exceeded` (429),
    `server_error` (500).
